version: '3.8'

services:
  jasmin-web:
    image: tarekaec/jasmin_web_panel:1.4.4
    ports:
      - "${JASMIN_WEB_PORT:-8999}:8000"
    deploy:
      replicas: 1
    env_file:
      - .env
    environment:
      DEBUG: 0
      DJANGO_SETTINGS_MODULE: config.settings.pro
      ALLOWED_HOSTS: '*'
      REDIS_URI: redis://redis:6379/1
      TELNET_HOST: jasmin
      SUBMIT_LOG: 1
      GUNICORN_CMD_ARGS: "--timeout 120"
    volumes:
      - web_public:/app/public
      - web_logs:/app/logs
      # Read-only access to Jasmin's per-connector logs so the panel can show
      # bind-failure reasons (default-<cid>.log). Same host dir Jasmin writes to.
      - ./logs:/var/log/jasmin:ro
      - ./main/core/smpp/conn.py:/app/main/core/smpp/conn.py:ro
      - ./main/core/smpp/smppccm.py:/app/main/core/smpp/smppccm.py:ro
      - ./main/core/smpp/mtrouter.py:/app/main/core/smpp/mtrouter.py:ro
      - ./main/core/tools.py:/app/main/core/tools.py:ro
      - ./main/core/middleware.py:/app/main/core/middleware.py:ro
      - ./main/core/utils/common.py:/app/main/core/utils/common.py:ro
      - ./main/web/views/content/smppccm.py:/app/main/web/views/content/smppccm.py:ro
      - ./main/web/views/content/users.py:/app/main/web/views/content/users.py:ro
      - ./main/web/views/content/submit_logs.py:/app/main/web/views/content/submit_logs.py:ro
      - ./main/web/helpers.py:/app/main/web/helpers.py:ro
      # Live-reload mounts for design pass — entire templates/static trees so we
      # iterate without rebuilding the image. collectstatic runs on container start.
      - ./main/web/templates:/app/main/web/templates:ro
      - ./main/web/static:/app/main/web/static:ro
      - ./main/static:/app/main/static:ro
      - ./main/web/views:/app/main/web/views:ro
      - ./main/web/urls.py:/app/main/web/urls.py:ro
      - ./main/campaigns:/app/main/campaigns
      - ./config/urls.py:/app/config/urls.py:ro
      - ./config/settings/com.py:/app/config/settings/com.py:ro
      # Fake DLR implementation files
      - ./main/core/fake_dlr.py:/app/main/core/fake_dlr.py:ro
      - ./main/core/fake_dlr_router.py:/app/main/core/fake_dlr_router.py:ro
      - ./main/core/models/fake_dlr.py:/app/main/core/models/fake_dlr.py:ro
      - ./main/core/models/route_detail.py:/app/main/core/models/route_detail.py:ro
      - ./main/core/models/__init__.py:/app/main/core/models/__init__.py:ro
      - ./main/core/admin/fake_dlr.py:/app/main/core/admin/fake_dlr.py:ro
      - ./main/core/admin/__init__.py:/app/main/core/admin/__init__.py:ro
      - ./main/api/views/fake_dlr.py:/app/main/api/views/fake_dlr.py:ro
      - ./main/api/views/fake_dlr.py:/app/main/api/views/fake_dlr.py:ro
      - ./main/core/management/commands/fake_dlr.py:/app/main/core/management/commands/fake_dlr.py:ro
      - ./main/core/migrations:/app/main/core/migrations:ro
    depends_on:
      - redis
      - db
      - rabbitmq
    restart: unless-stopped

  jasmin-celery:
    image: tarekaec/jasmin_web_panel:1.4.4
    entrypoint: bash ./docker-entrypoint-celery.sh
    deploy:
      replicas: 1
    env_file:
      - .env
    environment:
      DEBUG: 0
      DJANGO_SETTINGS_MODULE: config.settings.pro
      CELERY_LOG_LEVEL: info
    volumes:
      - ./main/campaigns:/app/main/campaigns
      - ./main/web/helpers.py:/app/main/web/helpers.py:ro
      - ./main/core/middleware.py:/app/main/core/middleware.py:ro
      - ./main/core/utils/common.py:/app/main/core/utils/common.py:ro
      - ./main/core/smpp/conn.py:/app/main/core/smpp/conn.py:ro
      - ./main/core/smpp/smppccm.py:/app/main/core/smpp/smppccm.py:ro
      - ./config/urls.py:/app/config/urls.py:ro
      - ./config/settings/com.py:/app/config/settings/com.py:ro
      # Fake DLR implementation files for Celery
      - ./main/core/fake_dlr.py:/app/main/core/fake_dlr.py:ro
      - ./main/core/fake_dlr_router.py:/app/main/core/fake_dlr_router.py:ro
      - ./main/core/models/fake_dlr.py:/app/main/core/models/fake_dlr.py:ro
    healthcheck:
      disable: true
    depends_on:
      - redis
      - db
    restart: unless-stopped

  redis:
    image: redis:alpine
    tty: true
    volumes:
      - redis_data:/data
    command:
      - 'redis-server'
      - '--appendonly yes'
      - '--save 10 1'
      - '--auto-aof-rewrite-percentage 100'
      - '--auto-aof-rewrite-min-size 64mb'
    restart: unless-stopped
    environment:
      REDIS_REPLICATION_MODE: master
      ALLOW_EMPTY_PASSWORD: "yes"
    healthcheck:
      test: redis-cli ping | grep PONG
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU:-2}"
          memory: ${REDIS_MEM:-512M}
    security_opt:
      - no-new-privileges:true

  rabbitmq:
    image: rabbitmq:3.10-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      #RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-ssl_opts.server_name_indication disable"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
    deploy:
      resources:
        limits:
          cpus: "${RABBITMQ_CPU:-4}"
          memory: ${RABBITMQ_MEM:-1024M}
        reservations:
          memory: 512M
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:18.0-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      # NOTE: Scripts in /docker-entrypoint-initdb.d run only on first initialization of the data
      # directory. For existing postgres_data volumes this init.sql will NOT be applied automatically;
      # run the GRANT statements manually (see Troubleshooting in README) or recreate the volume.
      - ./config/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-jasmin}"
      POSTGRES_USER: "${POSTGRES_USER:-jasmin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-jasmin}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jasmin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  jasmin:
    image: jookies/jasmin:latest
    restart: unless-stopped
    volumes:
      - ./jasmin_config/resource:/etc/jasmin/resource
      - ./jasmin_config/store:/etc/jasmin/store
      - ./jasmin_config:/etc/jasmin
      - ./logs:/var/log/jasmin
    ports:
      # Bound to localhost only — reach via SSH tunnel, never internet-exposed.
      - "127.0.0.1:${JASMIN_SMS_PORT:-2775}:2775"
      - "127.0.0.1:${JASMIN_DASHBOARD_PORT:-8990}:8990"
      - "127.0.0.1:${JASMIN_HTTP_API_PORT:-1401}:1401"
    depends_on:
      - redis
      - rabbitmq
    environment:
      REDIS_CLIENT_HOST: redis
      AMQP_BROKER_HOST: rabbitmq
      AMQP_BROKER_PORT: 5672
    sysctls:
      - net.ipv4.tcp_keepalive_time=60
      - net.ipv4.tcp_keepalive_intvl=10
      - net.ipv4.tcp_keepalive_probes=5
    deploy:
      resources:
        limits:
          cpus: "${JASMIN_CPU:-2}"
          memory: ${JASMIN_MEM:-512M}
    security_opt:
      - no-new-privileges:true

  sms_logger:
    image: jookies/jasmin:latest
    volumes:
      - ./jasmin_config/resource:/etc/jasmin/resource
      - ./jasmin_config:/etc/jasmin
      - ./sms_logger.py:/build/misc/scripts/sms_logger.py:ro
    command: bash -c "sleep 15 && pip install -U pip psycopg2-binary mysql-connector-python && exec python /build/misc/scripts/sms_logger.py"
    environment:
      DB_TYPE_MYSQL: ${DB_TYPE_MYSQL:-0}
      AMQP_BROKER_HOST: ${AMQP_BROKER_HOST:-rabbitmq}
      AMQP_BROKER_PORT: ${AMQP_BROKER_PORT:-5672}
      AMQP_SPEC_FILE: '/etc/jasmin/resource/amqp0-9-1.xml'
      AMQP_HEARTBEAT: 60  # Enable 60-second heartbeats
      RECONNECT_DELAY: 5  # Initial reconnect delay
      MAX_RECONNECT_DELAY: 60  # Max reconnect delay
      DB_HOST: ${DB_HOST:-db}
      DB_DATABASE: ${DB_DATABASE:-jasmin}
      DB_TABLE: ${DB_TABLE:-submit_log}
      DB_USER: ${DB_USER:-jasmin}
      DB_PASS: ${DB_PASS:-jasmin}
    depends_on:
      - rabbitmq
      - db
      - jasmin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('rabbitmq', 5672)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    sysctls:
      net.ipv4.tcp_keepalive_time: 60
      net.ipv4.tcp_keepalive_intvl: 10
      net.ipv4.tcp_keepalive_probes: 5

volumes:
  web_public:
    driver: local
  web_logs:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  postgres_data:
    driver: local
  monitoring_data:
    driver: local
